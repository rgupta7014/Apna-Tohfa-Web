services:
  - type: web
    name: apna-tohfa
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE_NAME
        value: APNA TOHFA
      - key: STORE_CURRENCY
        value: INR
      - key: ADMIN_EMAIL
        value: admin@apnatohfa.in
      - key: ADMIN_DEFAULT_PASSWORD
        value: apnaAdmin@2026
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
